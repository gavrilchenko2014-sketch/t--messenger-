
- name: Build APK
        run: |
          cd unpacked/t-messenger/mobile
          flutter create . --project-name t_messenger --org com.tmessenger --platforms android
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              p = Path("android/app/build.gradle")
          text = p.read_text()
          text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          text = text.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
          p.write_text(text)
          PY
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          root = Path.home() / ".pub-cache"
          for p in root.rglob("build.gradle*"):
              if "file_picker" not in str(p):
                  continue
              text = p.read_text()
              new = text.replace("compileSdkVersion 34", "compileSdkVersion 36").replace("compileSdk = 34", "compileSdk = 36").replace("compileSdk 34", "compileSdk 36")
              if new != text:
                  p.write_text(new)
                  print("patched", p)
          PY
          flutter build apk --release --dart-define=API_BASE_URL=http://10.0.2.2:3000
