
 name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Unpack zip
        run: unzip -o t-messenger.zip -d unpacked

      - name: Build APK
        run: |
          cd unpacked/t-messenger/mobile
          flutter create . --project-name t_messenger --org com.tmessenger --platforms android
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              p = Path("android/app/build.gradle")
          text = p.read_text()
          text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          text = text.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
          p.write_text(text)
          print(p.read_text())
          PY
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL=http://10.0.2.2:3000

      - uses: actions/upload-artifact@v4
        with:
          name: t-messenger-apk
          path: unpacked/t-messenger/mobile/build/app/outputs/flutter-apk/app-release.apk       
